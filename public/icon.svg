<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="zenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <radialGradient id="zenCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background plate -->
  <rect width="512" height="512" rx="128" fill="#090D16" />
  
  <!-- Outer subtle zen ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1E293B" stroke-width="8" stroke-dasharray="12 16" />
  
  <!-- Enso inspired intelligence arcs -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#zenGlow)" stroke-width="24" stroke-linecap="round" stroke-dasharray="640 100" transform="rotate(-45 256 256)" />
  
  <!-- Inner focus ring -->
  <circle cx="256" cy="256" r="70" fill="none" stroke="#8B5CF6" stroke-width="10" stroke-opacity="0.6" stroke-linecap="round" stroke-dasharray="320 60" transform="rotate(75 256 256)" />
  
  <!-- Center Core -->
  <circle cx="256" cy="256" r="32" fill="url(#zenGlow)" />
  <circle cx="256" cy="256" r="16" fill="#FFFFFF" />
  
  <!-- Orbiting intelligence nodes -->
  <circle cx="256" cy="76" r="12" fill="#06B6D4" />
  <circle cx="436" cy="256" r="12" fill="#8B5CF6" />
  <circle cx="106" cy="336" r="9" fill="#6366F1" />
</svg>
